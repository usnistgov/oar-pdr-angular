<div class="modal-header dialogHeader center h-11 w-full text-center text-[30px] font-extrabold text-white">
    {{ title }}
</div>
<div class="modal-body center p-3 flex items-center gap-3">
    <mat-icon
        *ngIf="showWarningIcon"
        class="warning-icon mat-icon-2x">
        warning
    </mat-icon>
    <span [innerHTML]="message"></span>
</div>
<div class="modal-footer center m-2 mb-4 pt-2 flex gap-[5px] border-t border-gray-300">
    <button
        type="button"
        id="cd-ok-button"
        (click)="accept()"
        mat-button>
        {{ btnOkText }}
    </button>

    <button
        *ngIf="showCancelButton"
        type="button"
        id="cd-cancel-button"
        (click)="decline()"
        mat-button>
        {{ btnCancelText }}
    </button>
</div>
