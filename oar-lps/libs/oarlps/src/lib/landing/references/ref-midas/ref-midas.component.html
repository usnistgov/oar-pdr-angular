<!-- Edit mode -->
@if (isEditMode) {
    <div class="editable_container">
        <!-- <ng-template #hasReferences> -->
        <div
            class="editable_field"
            style="max-width: calc(100% - 70px); margin-right: 5px"
        >
            <div
                *ngIf="
                    isEditMode &&
                    (!record['references'] || record['references'].length == 0)
                "
                [ngStyle]="
                    mdupdsvc.getFieldStyle(
                        fieldName,
                        dataChanged,
                        undefined,
                        isEditing
                    )
                "
                style="margin-bottom: 10px; padding-left: 10px"
            >
                Add references to papers and other datasets.
            </div>

            <ref-pub [record]="record"></ref-pub>
            <!-- <div [ngStyle]="mdupdsvc.getFieldStyle(fieldName, dataChanged, undefined, isEditing)" *ngFor="let ref of record['references']" style="padding-left: 10px; padding-top: 5px;min-height: 1.65em;">
                <span *ngIf="ref.location; else noreflink">
                    <mat-icon>link</mat-icon>
                    <a href={{ref.location}} target="blank">{{ ref['location'] }}</a>
                </span>
                <ng-template #noreflink>
                    <span >{{ ref['citation'] }}</span>
                </ng-template>
            </div> -->
        </div>
        <!-- </ng-template> -->

        <!-- Control buttons -->
        <div
            class="editable_field"
            *ngIf="isEditMode"
            style="white-space: nowrap; width: 1.65em"
        >
            <!-- <button
                class="edit_button"
                *ngIf="isNormal"
                (click)="startEditing()"
                aria-label="Edit reference"
                matTooltip="Edit reference"
                matTooltipPosition="above"
            >
                <fa-icon
                    [icon]="faPencil"
                    size="sm"
                    data-toggle="tooltip"
                    title="Edit description"
                ></fa-icon>
            </button> -->

            <fa-icon
                class="edit_button action-icon"
                *ngIf="isNormal"
                [icon]="faPencil"
                size="sm"
                (click)="startEditing()"
                aria-label="Edit button"
                matTooltip="Edit reference"
                matTooltipPosition="above"
            ></fa-icon>

            <!-- Hide button - hide edit block -->
            <!-- <button
                class="edit_button"
                *ngIf="!isNormal"
                [disabled]="childIsEditing || childIsAdding"
                (click)="hideEditBlock()"
                aria-label="Hide edit block"
                matTooltip="Hide edit block"
                matTooltipPosition="above"
            >
                <fa-icon [icon]="faXmark"></fa-icon>
            </button> -->

            <fa-icon
                class="edit_button action-icon"
                *ngIf="!isNormal && !childIsEditing && !childIsAdding"
                [icon]="faXmark"
                size="sm"
                (click)="hideEditBlock()"
                aria-label="Hide edit block"
                matTooltip="Hide edit block"
                matTooltipPosition="above"
            ></fa-icon>

            <!-- Undo all changes button -->
            <!-- <button
                #undo
                class="edit_button"
                *ngIf="refChanged || refUpdated"
                [disabled]="childIsEditing || childIsAdding"
                (click)="undoAllChanges()"
                aria-label="Undo"
                matTooltip="Undo"
                matTooltipPosition="above"
            >
                <fa-icon
                    [icon]="faUndo"
                    data-toggle="tooltip"
                    title="Undo description changes"
                ></fa-icon>
            </button> -->

            <fa-icon
                *ngIf="!editBlockExpanded && (refChanged || refUpdated)"
                class="edit_button action-icon"
                [class.disabled]="childIsEditing || childIsAdding"
                [icon]="faUndo"
                size="sm"
                (click)="undoAllChanges()"
                aria-label="Undo button"
                matTooltip="Undo"
                matTooltipPosition="above"
            ></fa-icon>
        </div>
    </div>
}
<!-- preview mode -->
<!-- <ng-template #nonEdit> -->
@else {
    <ref-pub [record]="record"></ref-pub>
}

<!-- Defer block for lazyloading
    The components inside the block must be stand alone component.
    This block will only be loaded when loadEditRefBlock is set to true.
-->
@if (loadEditRefBlock) {
    <div
        style="width: 100%"
        [@editExpand]="editBlockExpanded"
        [style.overflow]="overflowStyle"
    >
        <lib-ref-list
            #reflist
            [nerdmRecord]="record"
            [inBrowser]="inBrowser"
            (dataCommand)="onRefChange($event)"
            (editmodeOutput)="setChildEditMode($event)"
        ></lib-ref-list>
    </div>
}
