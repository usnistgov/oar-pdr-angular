<!-- Edit Control button bar -->
<div
    class="control-wrapper science-theme-background"
    *ngIf="_editMode != EDIT_MODES.VIEWONLY_MODE"
    [ngStyle]="{ 'background-image': 'url(' + imageURL + ')' }"
>
    <div class="current-mode">
        <div
            *ngIf="
                screenWidth > screenSizeBreakPoint &&
                _editMode != EDIT_MODES.DONE_MODE
            "
        >
            <span
                *ngIf="message"
                style="margin-left: 1em; margin-right: 1em; font-size: 12px"
                >{{ message }}</span
            >
            <span
                *ngIf="message"
                style="border: 1px solid white; color: white; cursor: pointer"
                (click)="message = ''"
            >
                <!-- <i class="fas fa-times"></i> -->
                <fa-icon [icon]="faTimes"></fa-icon>
            </span>
            {{ currentMode }}
            <span
                *ngIf="
                    mdupdsvc.recStatus.state == 'submitted' ||
                    mdupdsvc.recStatus.state == 'published'
                "
                class="splitter1"
            >
                |
            </span>
            <span
                *ngIf="
                    mdupdsvc.recStatus.state == 'submitted' ||
                    mdupdsvc.recStatus.state == 'published'
                "
                id="submitted"
            >
                {{ mdupdsvc.recStatus.state }}
                <!-- <i class="fas fa-info-circle" id="ec-info-btn-sm" (click)="toogleMessage()" data-toggle="tooltip"
                    title="Show message"></i> -->

                <fa-icon
                    id="ec-info-btn-sm"
                    [icon]="faCircleInfo"
                    (click)="toogleMessage()"
                    matTooltipPosition="above"
                    matTooltip="Show message"
                >
                </fa-icon>
            </span>
        </div>

        <div
            *ngIf="
                screenWidth <= screenSizeBreakPoint &&
                _editMode != EDIT_MODES.DONE_MODE
            "
            style="
                color: white;
                float: left;
                margin: 0.5em 0.5em 0em 1em;
                font-size: 15px;
            "
            [matTooltip]="editModeTooltip"
            matTooltipPosition="above"
        >
            <!-- <span class="fa-stack" style="margin-right:-1em;color: white;">
                <i class="far fa-circle fa-stack-2x"></i>
                <i class="fas fa-stack-1x fa-xs" [ngClass]="editModeIconClass"></i>
            </span> -->

            <span
                class="fa-stack"
                size="2x"
                style="margin-right: -1em; color: white"
            >
                <fa-icon
                    [icon]="faCircle"
                    class="fa-stack-2x"
                    style="scale: 0.8"
                ></fa-icon>
                <fa-icon
                    [icon]="faDownload"
                    class="fa-stack-1x small"
                ></fa-icon>
            </span>
        </div>
    </div>

    <div class="edit-control-buttons">
        <!-- <ng-select
            *ngIf="isRevisionType"
            [(ngModel)]="revisionType"
            [clearable]="false"
            [searchable]="false"
            class="custom"
            [ngStyle]="revisionWidth"
            [disabled]="!readyEdit"
            (change)="onRevisionTypeChange($event)"
            (click)="refreshHelpText()">
            <ng-option
                *ngFor="let revision of arrRevisionTypes"
                [value]="revision.type">
                {{revision.type}}
            </ng-option>
        </ng-select> -->

        <fa-icon
            id="ec-info-btn"
            [icon]="faCircleInfo"
            (click)="showEditControlHelpPopup($event)"
            matTooltipPosition="above"
            matTooltip="Show edit control help"
        >
        </fa-icon>

        <!-- Submit for review button -->
        <button
            mat-raised-button
            *ngIf="screenWidth > screenSizeBreakPoint && !mobileMode"
            matTooltip="Submit for Review"
            matTooltipPosition="above"
            class="btn btn-labeled"
            id="ec-review-btn"
            (click)="submitReview()"
            [disabled]="isDoneMode || isOutsideMidasMode || !readyEdit"
            label="Submit for Review"
        >
            <fa-icon [icon]="faCircleArrowUp"></fa-icon> Submit for Review
        </button>

        <!-- <button class="btn" id="ec-review-btn" type="button">
            <fa-icon [icon]="['fas', circleArrowUpIcon]"></fa-icon> Submit for Review
        </button> -->

        <button
            mat-raised-button
            *ngIf="screenWidth <= screenSizeBreakPoint && !mobileMode"
            matTooltip="Submit for Review"
            matTooltipPosition="above"
            class="btn btn-labeled"
            id="ec-review-btn-sm"
            (click)="openDialog_mat()"
            [disabled]="isDoneMode || isOutsideMidasMode || !readyEdit"
            label="Submit"
        >
            <fa-icon [icon]="faCircleArrowUp"></fa-icon>
            Submit
        </button>

        <button
            type="button"
            *ngIf="mobileMode"
            matTooltip="Submit for Review"
            matTooltipPosition="above"
            class="btn btn-labeled"
            id="ec-review-btn-mo"
            (click)="openDialog()"
            [disabled]="isDoneMode || isOutsideMidasMode || !readyEdit"
        >
            <fa-icon [icon]="faCircleArrowUp"></fa-icon>
        </button>

        <!-- Discard button -->
        <button
            *ngIf="!mobileMode"
            mat-raised-button
            matTooltip="Discard"
            matTooltipPosition="above"
            class="btn btn-labeled"
            id="ec-discard-btn"
            (click)="confirmDiscardEdits()"
            [disabled]="isDoneMode || isOutsideMidasMode || !readyEdit"
        >
            <fa-icon [icon]="faTrashCan"></fa-icon>
            Discard
        </button>

        <button
            *ngIf="mobileMode"
            type="button"
            matTooltip="Discard"
            matTooltipPosition="above"
            class="btn btn-labeled"
            id="ec-discard-btn-sm"
            (click)="confirmDiscardEdits()"
            [disabled]="isDoneMode || isOutsideMidasMode || !readyEdit"
        >
            <fa-icon [icon]="faTrashCan"></fa-icon>
        </button>

        <!--
            -  Edit button:
            -  When editing is off, the Edit button will show;
                - If this is revision mode, the label is "Start Revision".
                - Otherwise, the label is "Edit".
            -  If editing is on, the "Preview" button will show in its place
        -->
        <button
            mat-raised-button
            matTooltip="Edit"
            matTooltipPosition="above"
            *ngIf="!mobileMode && isPreviewMode"
            type="button"
            class="btn btn-labeled ec-edit-btn"
            (click)="onEdit()"
            id="ec-edit-btn"
            [disabled]="!editEnable"
        >
            <fa-icon [icon]="faPencil"></fa-icon>
            {{ editBtnLabel }}
        </button>

        <button
            type="button"
            matTooltip="Edit"
            matTooltipPosition="above"
            *ngIf="mobileMode && isPreviewMode"
            type="button"
            class="btn btn-labeled ec-edit-btn"
            (click)="onEdit()"
            id="ec-edit-btn-sm"
            [disabled]="!editEnable"
        >
            <fa-icon [icon]="faPencil"></fa-icon>
        </button>

        <!-- Preview button -->
        <!-- Normal mode -->
        <button
            mat-raised-button
            *ngIf="!mobileMode && isEditMode"
            class="btn mat-btn btn-labeled"
            id="ec-preview-btn"
            matTooltip="Preview"
            matTooltipPosition="above"
            [ngClass]="buttonSize"
            (click)="preview()"
            [disabled]="!readyEdit"
        >
            <mat-icon>visibility</mat-icon>
            Preview
        </button>

        <button
            mat-icon-button
            *ngIf="mobileMode && isEditMode"
            class="btn mat-btn btn-labeled"
            id="ec-files-btn"
            [ngClass]="beanSize"
            (click)="preview()"
            [disabled]="!readyEdit"
            aria-label="Preview"
            matTooltip="Preview"
            matTooltipPosition="above"
        >
            <mat-icon class="btn-icon">visibility</mat-icon>
        </button>
        <!-- <button
            type="button"
            matTooltip="Preview"
            *ngIf="!mobileMode && isEditMode"
            type="button"
            class="btn btn-labeled"
            (click)="preview()"
            id="ec-preview-btn"
            [disabled]="!readyEdit">

            <fa-icon [icon]="faEye"></fa-icon>Preview
        </button> -->

        <!-- mobile mode -->
        <!-- <button
            type="button"
            matTooltip="Preview"
            *ngIf="mobileMode && isEditMode"
            class="btn btn-labeled"
            (click)="preview()"
            id="ec-preview-btn-mo"
            [disabled]="!readyEdit">

            <fa-icon [icon]="faEye"></fa-icon>
        </button> -->

        <!-- Manage Files button -->
        <button
            mat-raised-button
            *ngIf="!mobileMode"
            class="btn mat-btn btn-labeled"
            id="ec-files-btn"
            [matTooltip]="fileManagerTooltip"
            matTooltipPosition="above"
            [ngClass]="beanSize"
            (click)="openFileManager()"
            [disabled]="!readyEdit"
        >
            <mat-icon>open_in_new</mat-icon>
            {{ fileManagerBtnLabel }}
        </button>

        <button
            mat-icon-button
            *ngIf="mobileMode"
            class="btn mat-btn btn-labeled"
            id="ec-files-btn"
            [ngClass]="beanSize"
            (click)="openFileManager()"
            [disabled]="!readyEdit"
            aria-label="Open external site"
            matTooltip="Open in a new tab"
            matTooltipPosition="above"
        >
            <mat-icon class="btn-icon">open_in_new</mat-icon>
        </button>
    </div>
</div>

<!-- status message bar -->
<div id="statusbar">
    <pdr-edit-status
        [(mdrec)]="mdrec"
        [forceDisplay]="forceDisplay"
    ></pdr-edit-status>
</div>
