<!-- <div class="ec-status-bar" *ngIf="_editmode != EDIT_MODES.PREVIEW_MODE && _editmode != EDIT_MODES.VIEWONLY_MODE && showMsg"> -->
<div
    class="ec-status-bar"
    *ngIf="forceDisplay || _editmode != EDIT_MODES.PREVIEW_MODE"
>
    <span class="badge">
        {{ action }}
    </span>

    <span class="status-message">
        <span
            [ngStyle]="{ color: messageColor }"
            [innerHTML]="message">
        </span>

        <fa-icon
            *ngIf="isProcessing"
            [icon]="faSpinner"
            class="ec-status-spinner"
            [animation]="'spin'">
        </fa-icon>
    </span>
</div>
