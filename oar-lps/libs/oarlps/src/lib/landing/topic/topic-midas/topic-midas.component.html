<topic-pub 
    [record]="record" 
    [inBrowser]="inBrowser"
    [isEditMode]="isEditMode">

    <ng-template #contentTemplate let-data="data">
        <!-- Control buttons -->
        <!-- Edit button -->
        <fa-icon
            *ngIf="!editingTopics(data)"
            class="edit_button action-icon"
            [icon]="faPencil"
            size="sm"
            (click)="startEditing(data)" 
            aria-label="edit button" 
            matTooltip="Edit topics"
            matTooltipPosition="above"
        ></fa-icon>

        <!-- Close edit block -->
        <fa-icon
            *ngIf="editingTopics(data)" 
            class="edit_button action-icon"
            [class.disabled]="dataChanged"
            [icon]="faXmark"
            size="sm"
            (click)="setMode()"
            aria-label="Close edit block" 
            matTooltip="Close edit block"
            matTooltipPosition="above"
        ></fa-icon>

        <!-- Restore original -->
        <fa-icon
            *ngIf="updated(data)" 
            class="edit_button action-icon"
            [icon]="faUndo"
            size="sm"
            (click)="restoreOriginal(data)" 
            aria-label="Close edit block" 
            matTooltip="Close edit block"
            matTooltipPosition="above"
        ></fa-icon>        
    </ng-template>
</topic-pub>

@if(isEditing) {
    <!-- Topic editor -->
    <div #topic [@editExpand]="editBlockStatus" style = "width: 100%;" [style.overflow] = "overflowStyle">
        <lib-topic-edit 
            [record]="record" 
            [inBrowser]="inBrowser" 
            [collection]="editCollection" 
            [selectedTopics]="topics[editCollection]" 
            [scheme]="editScheme"
            (dataChangedOutput)="onDataChange($event)" 
            (cmdOutput)="onCommandChanged($event)"></lib-topic-edit>
    </div>
}
