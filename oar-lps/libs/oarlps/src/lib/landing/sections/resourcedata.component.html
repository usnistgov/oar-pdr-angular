<div *ngIf="showDataSection" id="dataAccess" [ngStyle]="{'max-width': maxWidth+'px'}">
    <div class="section-header" >
        <lib-section-title [sectionTitle]="sectionTitle" [inBrowser]="inBrowser" sectionTag="dataAccessHeader" id="dataAccessHeader" #dataAccessHeader></lib-section-title>
    </div>

    <dl *ngIf="accessLevelPublic || accessLevelRestricted || accessRights">
        <dt>
            <span style="margin-left:0em" *ngIf="accessLevelPublic">
                <!-- <i class="faa faa-globe"></i>  -->
                <fa-icon [icon]="faGlobe" size="sm"></fa-icon>
                These data are public.
            </span>

            <span *ngIf="accessLevelRestricted">
                <fa-icon [icon]="faLock" size="sm"></fa-icon>
                This data has access restrictions.
            </span>

            <!-- Display access right -->
            <span id="accessRights" *ngIf="accessRights">
                Access rights statement:
            </span>
        </dt>

        <dd *ngIf="accessRights">
            {{record['rights']}}
        </dd>
    </dl>

    <!-- Display Homepage button if 'landingPage field exist and does not contain '/od/id' -->
    <div *ngIf="record['landingPage'] && record['landingPage'].indexOf('/od/id') === -1 ">
        For more information, please visit the
        <a target="_blank" href="{{ record['landingPage'] }}"
            (click)="gaService.gaTrackEvent('homepage', $event, 'Resource title: ' + record.title, record['landingPage'])">home
            page</a>.
    </div>

    <!-- Access pages. Hidden if no content -->
    <div id="accessPages" [style.display]="hasAccessPageContent ? null : 'none'">
        <div style="width: 100%;">
            @if(isPublicSite) {
                <accesspage-pub 
                    [record]="record" 
                    [theme]="theme"
                    [isPublicSite]="isPublicSite"
                    (hasContentChange)="setAccesspaeContent($event)">
                </accesspage-pub>
            }
            @else {
                <accesspage-midas 
                    [record]="record" 
                    [theme]="theme" 
                    [isEditMode]="isEditMode"
                    (hasContent)="setAccesspaeContent($event)">
                </accesspage-midas>
            }
        </div>
    </div>

    @if(theme == defaultTheme) {
        @if(isPublicSite){
            <lib-datafiles-pub
                [record]="record" 
                [inBrowser]="inBrowser" 
                [editEnabled] = false
                (dlStatus)="setDownloadStatus($event)">
            </lib-datafiles-pub>
        }
        @else{
            <lib-datafiles-midas
                [record]="record" 
                [inBrowser]="inBrowser" 
                [editEnabled]="editEnabled"
                [isEditMode]="isEditMode"
                (dlStatus)="setDownloadStatus($event)">
            </lib-datafiles-midas>
        }
    }

    <div *ngIf="hasDRS" style="margin-top: 2em;margin-right: 0px;">
        <app-searchresult [record]="record" [inBrowser]="inBrowser" [collection]="collection">
        </app-searchresult>
    </div>
</div>
