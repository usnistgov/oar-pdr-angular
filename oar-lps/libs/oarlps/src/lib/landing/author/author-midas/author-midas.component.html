<div style="display: table">
    <div class="editable_container">
        <div
            class="editable_field"
            *ngIf="
                !record[fieldName] ||
                record[fieldName].length == 0 ||
                isEditMode
            "
        >
            <div
                class="editable_field"
                *ngIf="isEditMode"
                [ngStyle]="
                    mdupdsvc.getFieldStyle(fieldName, false, undefined, false)
                "
            >
                @if (isScienceTheme) {
                    Facilitators:
                } @else {
                    Authors:
                }
            </div>
        </div>

        <div class="editable_field">
            <author-pub [record]="record" [fieldName]="fieldName"></author-pub>
        </div>

        @if (isEditMode) {
            <!-- Control buttons -->
            <div class="editable_field" style="white-space: nowrap">
                <!-- Edit button -->
                <fa-icon
                    *ngIf="!childIsEditing && !childIsAdding"
                    class="edit_button action-icon"
                    [icon]="faPencil"
                    size="sm"
                    (click)="startEditing()"
                    aria-label="Edit author"
                    matTooltip="Edit author"
                    matTooltipPosition="above"
                ></fa-icon>

                <!-- Hide button - hide edit block -->
                <fa-icon
                    *ngIf="isEditing"
                    class="edit_button action-icon"
                    [class.disabled]="childIsEditing || childIsAdding"
                    [icon]="faXmark"
                    size="sm"
                    (click)="hideEditBlock()"
                    aria-label="Hide edit block"
                    matTooltip="Hide edit block"
                    matTooltipPosition="above"
                ></fa-icon>

                <!-- Undo all changes button -->
                 <fa-icon
                    *ngIf="editBlockStatus == 'collapsed' && (authorsChanged || authorsUpdated)"
                    class="edit_button action-icon"
                    [class.disabled]="childIsEditing || childIsAdding"
                    [icon]="faUndo"
                    size="sm"
                    (click)="undoAllChanges()"
                    aria-label="Undo button"
                    matTooltip="Undo"
                    matTooltipPosition="above"
                ></fa-icon>                
            </div>
        }
    </div>
</div>

<!-- Author editor -->
<div
    [@editExpand]="editBlockStatus"
    style="width: 100%"
    [style.overflow]="overflowStyle"
>
    <lib-author-list
        #authorlist
        [record]="record"
        [fieldName]="fieldName"
        [startEditing]="editingStarted"
        (dataChanged)="onAuthorChange($event)"
        (editmodeOutput)="setChildEditMode($event)"
    >
    </lib-author-list>
</div>
