<!-- When editEnabled is true, there are two modes: edit mode and preview mode. 
     This is defined by mdupdsvc.isEditMode (boolean).
     In edit mode, there are also two modes: editing and non-editing.
     This is defined by isEditing variable (boolean).

     The textarea box only shows up when isEditng = true. Otherwise display text.
     The pencil button only shows up when mdupdsvc.isEditMode is true and isEditing = false.
     The close button only shows up when isEditing=true and nothing changed.
     The cancel button only shows up when isEditing=true and title changed.
     Save button shows up when isEditing is true. But disabled when nothing changed.
  -->
<div style="width: 100%">
    <div style="display: table; margin-bottom: 0em; width: 100%">
        <div class="editable_container no-wrap" style="width: 100%">
            <div class="editable_field red-star" *ngIf="isEditMode">*</div>

            @if (isEditing) {
                <div class="editable_field normal-wrap" [ngStyle]="titleWidth">
                    <h2 style="width: 100%">
                        <textarea
                            #title
                            autocomplete="off"
                            [(ngModel)]="record.title"
                            [placeholder]="placeholder"
                            (ngModelChange)="setBackground($event)"
                            [ngStyle]="
                                mdupdsvc.getFieldStyle(fieldName, dataChanged)
                            "
                            style="width: 100%; cursor: text"
                            libTextareaAutoresize
                        ></textarea>
                    </h2>
                </div>
            } @else {
                <div
                    class="editable_field normal-wrap"
                    (click)="startEditing()"
                    style="width: fit-content"
                    [ngStyle]="
                        mdupdsvc.getFieldStyle(
                            fieldName,
                            false,
                            undefined,
                            false
                        )
                    "
                >
                    @if (record["title"]) {
                        <span
                            ><h2>{{ record.title }}</h2></span
                        >
                    } @else {
                        <span style="color: var(--disabled-grey-text)">{{
                            placeholder
                        }}</span>
                    }
                </div>
            }

            <!-- Control buttons -->
            @if (isEditMode) {
                <div class="editable_field" style="white-space: nowrap;margin: 5px 10px;">
                    @if (!isEditing) {
                         <fa-icon
                            class="edit_button action-icon"
                            [icon]="faPencil"
                            size="sm"
                            (click)="startEditing()"
                            aria-label="Edit title"
                            matTooltip="Edit title"
                            matTooltipPosition="above"
                        ></fa-icon>

                        @if (updated) {
                            <!-- Restore button, restore original value -->
                            <fa-icon
                                class="edit_button action-icon"
                                [icon]="faUndo"
                                size="sm"
                                (click)="restoreOriginal()"
                                aria-label="Restore button"
                                matTooltip="Restore original title"
                                matTooltipPosition="above"
                            ></fa-icon>
                        }
                    } @else {
                        <!-- Save button -->
                         <fa-icon
                            class="edit_button action-icon"
                            [icon]="faSave"
                            [class.disabled]="!dataChanged"
                            size="sm"
                            (click)="onSave()"
                            aria-label="save button"
                            matTooltip="Save changes"
                            matTooltipPosition="above"
                        ></fa-icon>                        

                        <!-- Cancel editing button: cancel current changes -->
                        <fa-icon
                            *ngIf="dataChanged"
                            class="edit_button action-icon"
                            [icon]="faUndo"
                            size="sm"
                            (click)="cancelEditing()"
                            aria-label="undo button"
                            matTooltip="Cancel edit"
                            matTooltipPosition="above"
                        ></fa-icon>   
                        
                        <!-- Close button -->
                        <fa-icon
                            *ngIf="!dataChanged"
                            class="edit_button action-icon"
                            [icon]="faXmark"
                            size="sm"
                            (click)="cancelEditing()"
                            aria-label="Close button"
                            matTooltip="Cancel edit"
                            matTooltipPosition="above"
                        ></fa-icon>   
                    }
                </div>
            }
        </div>
    </div>
</div>
