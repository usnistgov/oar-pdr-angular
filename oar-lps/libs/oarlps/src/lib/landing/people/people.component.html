<div class="inner-addon right-addon">
  <mat-form-field class="autocomplete">
    <img
      matPrefix
      class="search-icon"
      src="assets/images/PeopleSearch.png"
      matTooltip="People lookup"
      alt="People lookup"
    />

    <input
      matInput
      id="person"
      [placeholder]="placeHolderText"
      [(ngModel)]="selectedSuggestion"
      [matAutocomplete]="auto"
      (input)="setSuggestions($event)"
    />

    <mat-autocomplete
      #auto="matAutocomplete"
      [displayWith]="displaySuggestion"
      (optionSelected)="getFullRecord($event.option.value)"
    >
      <mat-option
        *ngFor="let suggestion of suggestions"
        [value]="suggestion"
      >
        {{ suggestion.display }}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
