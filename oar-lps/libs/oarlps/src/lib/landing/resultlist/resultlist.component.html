<div
    class="results-container"
    *ngIf="showResultList"
>
    <div
        class="result-header"
        *ngIf="searchResultsForDisplay"
        [style.background-color]="colorScheme.defaultVar"
    >
        <!-- Number of search results -->
        <div class="result-count">
            {{ totalResultItems }}
            <span *ngIf="resultWidthNum > 830">datasets </span>
            <span *ngIf="resultWidthNum > 500">found</span>
        </div>

        <!-- Pagination -->
        <select
            class="header-select"
            (change)="onSelected($event)"
        >
            <option *ngFor="let page of pages">
                {{ page.name }}
            </option>
        </select>

        <!-- Sorting -->
        <select
            class="header-select"
            required
            (change)="onSortByChange($event)"
        >
            <option value="" disabled selected>Sorted by...</option>
            <option value="none">None</option>

            <option *ngFor="let option of options">
                {{ option.name }}
            </option>
        </select>

        <!-- Search -->
        <div class="search-wrapper">
            <mat-icon class="search-icon">search</mat-icon>

            <input
                id="freeTextSearch"
                type="text"
                matInput
                [(ngModel)]="searchPhases"
                placeholder="Search for"
                (input)="filterResults()"
            />
        </div>
    </div>

   <!-- Search result -->
    <div *ngIf="showResult">
        <div
            *ngFor="let resultItem of searchResultsForDisplay; let i = index"
            style="width: 100%; padding: 0px 0px 0px 0px"
        >
            <div
                *ngIf="
                    resultItem.active &&
                    i >= (currentPage.value - 1) * itemsPerPage &&
                    i <= currentPage.value * itemsPerPage - 1
                "
                style="margin-bottom: 0.2em; padding-bottom: 0.2em"
            >
                <app-resultitem
                    [resultItem]="resultItem"
                    [PDRAPIURL]="PDRAPIURL"
                    [colorScheme]="colorScheme"
                ></app-resultitem>
            </div>
        </div>
    </div>

    <div *ngIf="noSearchResult">
        <div style="text-align: center; border-bottom: 1px solid grey">
            <img
                id="dog"
                src="./assets/images/NothingFound2_s.png"
                alt="nothing found"
            />
            <span class="nothing-found-text">Nothing found...</span>
        </div>
    </div>

    <div class="spinner" *ngIf="!searchResults">
        <mat-icon class="material-icon-spin" aria-hidden="true">
            autorenew
        </mat-icon>
    </div>
</div>
