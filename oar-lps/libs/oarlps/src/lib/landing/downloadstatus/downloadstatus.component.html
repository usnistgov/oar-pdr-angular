<div
    *ngIf="showDownloadStatus"
    [ngStyle]="menuStyle()"
    style="
        background-color: var(--background-default);
        color: white;
        width: 100%;
        margin-top: 1em;
        border-radius: 4px 4px 0px 0px;
        font-weight: bold;
        padding-left: 0.7em;
    "
>
    Data Cart Status
</div>
<div
    *ngFor="let key of getKeys; let i = index"
    style="
        width: 100%;
        border: 1px solid rgb(231, 231, 231);
        border-radius: 0px 0px 4px 4px;
    "
>
    <span
        *ngIf="dataCartStatus.dataCartStatusItems[key].downloadPercentage > 0"
        class="download-status"
    >
        <span class="cart-name">
            {{ cartName(key) }}
        </span>

        <div class="progress-row">
            <div class="progress-container">
                <mat-progress-bar
                    [value]="
                        dataCartStatus.dataCartStatusItems[key]
                            .downloadPercentage
                    "
                    mode="determinate"
                >
                </mat-progress-bar>

                <span class="progress-value">
                    {{
                        dataCartStatus.dataCartStatusItems[key]
                            .downloadPercentage
                    }}%
                </span>
            </div>

            <span
                class="cancel-download"
                (click)="removeStatusItem(key)"
                matTooltip="Cancel all downloads"
                matTooltipPosition="above"
            >
                <fa-icon [icon]="faXmark"></fa-icon>
            </span>
        </div>
    </span>
