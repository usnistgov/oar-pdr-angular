<div class="editable_field">
    @if (this.savedCollection == "None") {
        @if (isEditMode) {
            Add to domain collection
        }
    } @else {
        <ispartof-pub
            [record]="record"
            [landingPageServiceStr]="landingPageServiceStr"
        ></ispartof-pub>
    }
</div>

<!-- Control buttons -->
<div *ngIf="isEditMode" class="editable_field" style="white-space: nowrap; margin: -4px 10px 0 10px;">
    <!-- Edit button -->
    <fa-icon
        class="edit_button action-icon"
        [icon]="faPencil"
        [class.disabled]="isEditing"
        size="sm"
        (click)="startEditing()"
        aria-label="Edit collection"
        matTooltip="Edit collection"
        matTooltipPosition="above"
    ></fa-icon>

    <!-- Undo button -->
    <fa-icon
        *ngIf="collectionDiff && !isEditing"
        class="edit_button action-icon"
        [icon]="faUndo"
        size="sm"
        (click)="undo()"
        aria-label="Undo Current Change"
        matTooltip="Undo Current Change"
        matTooltipPosition="above"
    ></fa-icon>
</div>

<!-- Editor -->
<!-- Lazy loading in edit mode. Never get loaded in public mode -->
@if (isEditing) {
    <div [@editExpand]="editBlockStatus" [style.overflow]="overflowStyle">
        <table>
            <tr style="width: 100%">
                <!-- Text edit area -->
                <td style="padding: 10px 0px">
                    <div class="radio-group editing-block">
                        <div *ngFor="let col of collectionData" class="radio">
                            <label [title]="col.displayName">
                                <input
                                    type="radio"
                                    required
                                    name="col"
                                    [value]="col.value"
                                    [(ngModel)]="selectedCollection"
                                    [checked]="col.value === selectedCollection"
                                    (change)="colChanged($event)"
                                />
                                {{ col.displayName }}
                            </label>
                        </div>
                    </div>
                </td>

                <!-- Control buttons -->
                <td style="padding: 10px 0px; width: 90px; vertical-align: top">
                    <!-- Save button -->
                    <fa-icon
                        class="edit_button action-icon"
                        [icon]="faSave"
                        [class.disabled]="!dataChanged"
                        size="sm"
                        (click)="saveCollection()"
                        aria-label="Save collection and close editing block"
                        matTooltip="Save collection and close editing block"
                        matTooltipPosition="above"
                    ></fa-icon>  
                                        
                    <!-- Cancel button -->
                    <fa-icon
                        *ngIf="!dataChanged"
                        class="edit_button action-icon"
                        [icon]="faXmark"
                        size="sm"
                        (click)="undoCurCollectionChanges()"
                        aria-label="close editing block"
                        matTooltip="close editing block"
                        matTooltipPosition="above"
                    ></fa-icon>  

                    <fa-icon
                        *ngIf="dataChanged"
                        class="edit_button action-icon"
                        [icon]="faUndo"
                        size="sm"
                        (click)="undoCurCollectionChanges()"
                        aria-label="Undo and close editing block"
                        matTooltip="Undo and close editing block"
                        matTooltipPosition="above"
                    ></fa-icon>                      
                </td>
            </tr>
        </table>
    </div>
}
