<div *ngIf="!hideSidebarBody" class="sbar-container" [@togglesbar]="sidebarState">
    <div>
        @if(showRevisionHelp){
            <div class="headerbar">
                <fa-icon 
                    *ngIf="circleXmarkIcon" 
                    [icon]="['fas', circleXmarkIcon]" 
                    class="btn-hide-help"
                    (click)="processCommand('getHelp')" 
                    aria-hidden="true"
                    data-toggle="tooltip" 
                    title="Hide Help"></fa-icon>
    
                <div class="help-title">
                    Revision Help
                </div>
            </div>

        }
        <div [@slideToggle]="showRevisionHelp ? 'visible' : 'hidden'" 
            class="revision-help" 
            [ngStyle]="{'max-height':maxHeight + 'px'}">
            <p [innerHTML]="revisionHelp['htmlcontent']"></p>
        </div>

        <div >
            <div class="headerbar">
                <div style="float: right; margin: 0px 5px 5px 5px;">
                    <fa-icon 
                        *ngIf="circleXmarkIcon" 
                        [icon]="['fas', circleXmarkIcon]" 
                        (click)="toggleSbarView()"
                        style="color: orange; cursor: pointer;"
                        aria-label="Close Help" 
                        title="Close Help"
                        data-toggle="tooltip">
                    </fa-icon>

                </div>
                <div class="help-title" (click)="this.showGeneralHelp = !this.showGeneralHelp">
                    {{title}}

                    <fa-icon 
                        *ngIf="!clickContact && caretRightIcon" 
                        [class.amplified]="isMouseOverGeneralHeader" 
                        [icon]="['fas', showGeneralHelp? caretDownIcon : caretRightIcon]"
                        class="amplifiable expand-btn" 
                        (mouseover)="isMouseOverGeneralHeader = true" 
                        (mouseleave)="isMouseOverGeneralHeader = false">
                    </fa-icon>
                </div>
            </div>
            <div class="general-help-content" 
                [@generalHelpExpand]="showGeneralHelp ? 'visible' : 'hidden'"
                [innerHTML]="sanitizedHtml">
            </div>
            
            <div class="help-title headerbar" (click)="this.showNextSteps = !this.showNextSteps">
                Next Steps:
                <fa-icon 
                    *ngIf="!clickContact && caretRightIcon" 
                    [class.amplified]="isMouseOverNextSteps"
                    [icon]="['fas', showNextSteps? caretDownIcon : caretRightIcon]" 
                    class="amplifiable expand-btn"
                    (mouseover)="isMouseOverNextSteps = true" 
                    (mouseleave)="isMouseOverNextSteps = false">
                </fa-icon>
            </div>
            
            <!-- Suggestions -->
            <div *ngIf="!hasRequiredItems && !hasWarnItems && !hasRecommendedItems; else nextSteps"
                style="padding: 10px"
                [innerHTML]="msgCompleted">
            </div>
            <ng-template #nextSteps>
                <div class="section-content" [@nextStepsExpand]="showNextSteps ? 'visible' : 'hidden'">
                
                    <div *ngIf="(!suggestions['req'] || suggestions['req'].length == 0) 
                                        && (!suggestions['warn'] || suggestions['warn'].length == 0) 
                                        && (!suggestions['rec'] || suggestions['rec'].length == 0)">
                        {{msgCompleted}}
                    </div>
                    
                    <div *ngIf="hasRequiredItems">
                        <suggestions suggestionLabel="Required" [suggestions]="suggestions['req']" showSug="true"
                            (gotoSectionName)="gotoSection($event)">
                        </suggestions>
                    </div>
                
                    <div *ngIf="hasWarnItems">
                        <suggestions suggestionLabel="Warning" [suggestions]="suggestions['warn']" [showSug]="expandWarning"
                            (gotoSectionName)="gotoSection($event)">
                        </suggestions>
                    </div>
                
                    <div *ngIf="hasRecommendedItems">
                        <suggestions suggestionLabel="Recommended" [suggestions]="suggestions['rec']" [showSug]="expandRec"
                            (gotoSectionName)="gotoSection($event)">
                        </suggestions>
                    </div>
                </div>       
            </ng-template>
        </div>
    </div>


    @if(isRevision) {
        <div class="help-title headerbar"  (click)="showRevisionData = !showRevisionData">
            Revision Data (Placeholder)

            <fa-icon *ngIf="!clickContact && caretRightIcon" [class.amplified]="isMouseOverSubmitStatus"
                [icon]="['fas', showRevisionData? caretDownIcon : caretRightIcon]" class="amplifiable"
                (mouseover)="isMouseOverRevision = true" (mouseleave)="isMouseOverRevision = false">
            </fa-icon>
        </div>

        <div 
            class="section-content" 
            style="padding: 10px;"
            [@revisionExpand]="showRevisionData ? 'visible' : 'hidden'">

            <revision-details 
                [submissionData]="submissionData" 
                (changedData)="updateSubmissionData($event)"
                (command)="processCommand($event)">
            </revision-details>
        </div>
    }

    <!-- Show submit status -->
    @if(isResubmit) {
        @if( hasSubmitStatusData ) {
            <div class="help-title headerbar" (click)="showSubmitStatus = !showSubmitStatus">
                Submit Status
            
                <fa-icon *ngIf="!clickContact && caretRightIcon" [class.amplified]="isMouseOverSubmitStatus"
                    [icon]="['fas', showSubmitStatus? caretDownIcon : caretRightIcon]" class="amplifiable"
                    (mouseover)="isMouseOverSubmitStatus = true" (mouseleave)="isMouseOverSubmitStatus = false">
                </fa-icon>
            </div>
            
            <div class="section-content" style="padding: 10px;" [@submitStatusExpand]="showSubmitStatus ? 'visible' : 'hidden'">
                <!-- Submit status: only display when record state is submitted or resubmit -->
                <submit-status [submitStatus]="submitStatus" [showFeedback]="showFeedback">
                </submit-status>
            </div>
        }@else {
            <div class="help-title headerbar">
                Submit Status (No Data)
            </div>
        }
 
    }

</div>
<!-- Side bar invisible -->
<div *ngIf="!sbarvisible" style="float:right; margin: 44px 20px 20px 20px;">
    <a (click)="toggleSbarView()" aria-label="Help"
    title="{{(sbarvisible) ? 'Close Help' : 'Open Help'}}">

        <fa-icon 
            *ngIf="circleQuestionIcon" 
            [icon]="['fas', circleQuestionIcon]" 
            style="color: orange; cursor: pointer;"
            aria-hidden="true"
            data-toggle="tooltip" 
            title="Help"></fa-icon>
    </a>
</div>
