<div *ngIf="inBrowser" [ngStyle]="{ 'background-image': 'url(' + imageURL + ')', 'background-position': '0% 60%'}"
    class="flex items-center justify-between text-white px-[3.5rem] py-2 bg-cover bg-bottom bg-no-repeat h-20">

    <!-- Left Section -->

    <div class="flex items-center gap-2">

        <mat-icon class="mr-2 !text-[36px] !w-9 !h-9 ">
            cloud_download
        </mat-icon>

        <!-- Desktop -->

        <span class="hidden xl:inline lg:hidden md:hidden sm:hidden font-medium text-3xl">
            Download Manager
        </span>

        <!-- Tablet -->

        <span class="hidden lg:inline sm:inline md:inline xl:hidden font-medium text-xl">
            Downloads
        </span>
  </div>

  <!-- Right Section -->

  <div class="flex items-center gap-2">

    <!-- Remove Selected -->
    <button
        mat-flat-button
        class="!rounded-[5px] !bg-[var(--nist-blue-lighter)] !text-white"
        matTooltip="Remove Selected"
        [disabled]="selectedFileCount==0"
        (click)="removeSelected()">

        <mat-icon class="text-white">
            delete
        </mat-icon>
        <span
            class="hidden lg:inline text-sm">
            Remove Selected
        </span>

        <!-- Right Badge -->

        <span
        class="ml-1 rounded-full
                bg-white text-black
                px-[6px] py-0.5
                text-xs font-semibold">

            {{ selectedFileCount }}

        </span>             
    </button>

    <!-- Remove Downloaded -->
    <button
        mat-flat-button
        class="!rounded-[5px] !bg-[var(--background-orange1-default)] !text-white"
        matTooltip="Remove Downloaded"
        [disabled]="!anyDownloaded()"
        (click)="removeDownloaded()">

        <mat-icon class="text-white">
            delete_sweep
        </mat-icon>
        <span
            class="hidden lg:inline text-sm">
            Remove Downloaded
        </span>

        <!-- Right Badge -->

        <span
            class="ml-1 rounded-full
                bg-white text-black
                px-[6px] py-0.5
                text-xs font-semibold">

            {{ totalDownloaded }}

        </span>          
    </button>

    <!-- Download Selected -->
    <button
        mat-flat-button
        class="!rounded-[5px] !bg-[var(--nist-green-default)] !text-white"
        matTooltip="Download Selected"
        [disabled]="selectedFileCount === 0"
        (click)="downloadSelected()">

        <mat-icon class="text-white">
            download
        </mat-icon>
        <span
            class="hidden lg:inline text-sm">
            Download Selected
        </span>

        <!-- Right Badge -->

        <span
        class="ml-1 rounded-full
                bg-white text-black
                px-[6px] py-0.5
                text-xs font-semibold">

        {{ selectedFileCount }}

        </span>        
    </button>
  </div>
</div>
